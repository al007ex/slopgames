# slopgames.al007ex.com — Slopgames arcade
#
# The portal (portal/server.mjs) runs on 127.0.0.1:3200 and is always up. It
# starts a game server on demand when someone presses Play and stops it again
# once the last player leaves, so the per-game locations below point at ports
# that are frequently closed — the 502/503/504 fallbacks hand those requests
# back to the portal, which serves a "server sleeping" page with a launch button
# instead of an nginx error.
#
# Certificates come from Let's Encrypt using certbot's nginx authenticator, so
# no static ACME webroot location is defined here.

server {
    listen 80;
    listen [::]:80;
    server_name slopgames.al007ex.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 is a listen-socket option in nginx 1.24 and the :443 socket is
    # shared with the other vhosts on this box, so it is left at the server
    # default rather than redefined here (nginx warns and ignores it otherwise).
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name slopgames.al007ex.com;

    ssl_certificate     /etc/letsencrypt/live/slopgames.al007ex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slopgames.al007ex.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;

    # Request bodies here are launch pokes and small game logins, never uploads.
    client_max_body_size 128k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # add_header does not merge with inherited headers, so every header the site
    # needs is declared once at server level and no location adds its own.
    # The policy has to cover the games as well as the portal: both use inline
    # scripts (DuoStrike also uses an import map), both talk over WebSockets,
    # and the portal pulls its two typefaces from Google Fonts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/xml+rss
               application/rss+xml application/javascript text/javascript
               application/json image/svg+xml application/manifest+json;

    # ---------------------------------------------------------------- games
    location = /duostrike { return 301 /duostrike/; }
    location ^~ /duostrike/ {
        proxy_pass http://127.0.0.1:3201/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_intercept_errors on;
        error_page 502 503 504 = /__game-offline/duostrike;
    }

    location = /pixel-brawl { return 301 /pixel-brawl/; }
    location ^~ /pixel-brawl/ {
        proxy_pass http://127.0.0.1:3202/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_intercept_errors on;
        error_page 502 503 504 = /__game-offline/pixel-brawl;
    }

    location = /circuit-breaker { return 301 /circuit-breaker/; }
    location ^~ /circuit-breaker/ {
        proxy_pass http://127.0.0.1:3203/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_intercept_errors on;
        error_page 502 503 504 = /__game-offline/circuit-breaker;
    }

    location = /glowworm { return 301 /glowworm/; }
    location ^~ /glowworm/ {
        proxy_pass http://127.0.0.1:3204/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Snapshots go out 15 times a second; buffering them in Nginx would only
        # add latency to a game that is all about reaction time.
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 = /__game-offline/glowworm;
    }

    location = /stormwall { return 301 /stormwall/; }
    location ^~ /stormwall/ {
        proxy_pass http://127.0.0.1:3205/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Snapshots go out 30 times a second; no buffering in the way.
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 = /__game-offline/stormwall;
    }

    location = /mootopia { return 301 /mootopia/; }
    location ^~ /mootopia/ {
        proxy_pass http://127.0.0.1:3206/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # One small binary frame per tick; no buffering in the way.
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 = /__game-offline/mootopia;
    }

    # --------------------------------------------------------------- portal
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
